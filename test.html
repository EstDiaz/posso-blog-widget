	<style>	.lw-blog-card { 
  position: relative; 
  border-radius: 20px;
  background: var(--blog-blue);
  border: none !important;
  overflow: visible; /* Etiquetas fuera del círculo */
  isolation: isolate; 
  transition: all 360ms ease;
}

.lw-blog-card h3 { 
    font-family: "Poppins";
    font-weight: 500;
    padding-top: 24px; 
}
.lw-blog-card .learnworlds-overline-text { font-size: 14px; }
.lw-blog-card .lw-blog-card-descr { display: none; }
.lw-blog-card .lw-padding-small { position: relative; z-index: 4; }

/* Imagen Círculo 1:1 */
.lw-blog-card .learnworlds-image {
  position: relative;
  display: block;
  width: calc(100% - 96px); /* 48px + 48px laterales */
  margin: 56px 48px 0;
  aspect-ratio: 1 / 1;
  border-radius: 9999px !important;
  overflow: visible;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
  transition: all 360ms ease;
  z-index: 1;
}

/* Tinte salmon */
.lw-blog-card .learnworlds-image::after {
  content: "";
  position: absolute; 
  inset: 0;
  border-radius: inherit;
  background: var(--salmon-200);
  mix-blend-mode: color;
  pointer-events: none;
  transition: opacity 280ms ease;
  z-index: 2; /* Sobre imagen, bajo tags */
}

/* Etiquetas del Blog */
.lw-blog-card .learnworlds-image .lw-tags {
  position: absolute !important;
  top: -40px;
  right: -32px;
  left: auto;
  width: 100%;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-right: 0px;
  z-index: 3;
}

.lw-blog-card .learnworlds-image .lw-tag {
  border-radius: 9999px;
  padding: 8px 14px;
  white-space: nowrap;
  line-height: 1;
  background: var(--black);
  color: var(--white); /* Para que resalte en el fondo negro inicial */
  transition: all 360ms ease;
}

/* Hover Blog Card */
.lw-blog-card:hover { 
  color: var(--blog-blue) !important; 
  background: var(--black) !important;
}

.lw-blog-card:hover .learnworlds-image::after { opacity: 0; }

.lw-blog-card:hover .learnworlds-image .lw-tag { 
  color: var(--black); 
  background: var(--blog-blue);
}

@media (max-width: 480px) {
  .lw-blog-card .learnworlds-image { margin: 24px 16px 0; }
  .lw-blog-card .learnworlds-image .lw-tags { right: 16px; top: -14px; }
}</style>
